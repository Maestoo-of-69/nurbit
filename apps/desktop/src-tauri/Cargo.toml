[package]
name = "nurbit-desktop"
description = "Nurbit desktop application (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Tauri convention: the app logic is a library; main.rs only calls run().
[lib]
name = "nurbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
nurbit-shared.workspace = true
nurbit-medical-core.workspace = true
nurbit-local-store.workspace = true
reqwest.workspace = true
tokio.workspace = true
